name = "ThomsonN9"
defaultTargets = ["ThomsonN9"]

# Mathlib is the only dependency, pinned to the same revision as the N = 7 package
# (references/thomson-n7-lean). Its own manifest fixes the versions of aesop, batteries, Qq, ...;
# lake-manifest.json records the resolved revisions. Do not run `lake update`.
[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

# The future proof: ThomsonN9.lean imports ThomsonN9/Solution.lean.
[[lean_lib]]
name = "ThomsonN9"

# The trusted statement file (four `sorry`s by design), to be compared with the proof by
# compare_statements.py / the Lean Comparator once a solution exists.
[[lean_lib]]
name = "ComparatorChallenges"
roots = ["ComparatorChallenges.ThomsonN9"]
